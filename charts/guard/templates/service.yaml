apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "guard.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "guard.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
